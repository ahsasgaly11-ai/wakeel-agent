name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "::error::Add the KS_PASS repository secret first"; exit 1; fi
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "wakeel-ci"
          git config user.email "ci@users.noreply.github.com"
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > errors.txt || true
          mkdir -p /tmp/logs && cp build.log errors.txt /tmp/logs/
          git checkout --orphan build-logs
          git rm -rf . > /dev/null
          cp /tmp/logs/* .
          git add build.log errors.txt
          git commit -m "build log for ${{ github.sha }}"
          git push -f origin build-logs

      - name: Name APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Wakeel-v1.0.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Wakeel-APK
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/*.apk \
            --title "وكيل v1.0.${{ github.run_number }}" \
            --notes "نسخة جاهزة للتثبيت. حمّل ملف APK من الأسفل وثبّته على هاتفك." \
            --latest
